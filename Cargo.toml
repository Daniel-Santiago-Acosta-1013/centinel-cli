[package]
name = "sentinel"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0"
dialoguer = "0.10"
directories = "5.0"
env_logger = "0.10"
log = "0.4"
crossterm = "0.27"
tokio = { version = "1.40", features = ["rt-multi-thread", "macros", "net", "signal", "time", "sync"] }
tun = "0.7"
hickory-proto = "0.24"
hickory-resolver = { version = "0.24", default-features = false, features = ["tokio-runtime"] }
nix = { version = "0.27", features = ["user"] }

[dev-dependencies]
tempfile = "3.10"
